# SoulPlus AI V2 backend.
# Do not link this folder to the V1 project.
# Setup: see supabase/README.md
# From repo root: supabase link --project-ref <V2_PROJECT_REF>

project_id = "soulplus-ai-v2"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080/login/callback",
  "http://localhost:8080/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Global: Google/Apple/email must not create users. Admin.createUser after payment still works.
enable_signup = false

[auth.sessions]
# Stay signed in for months. Access token still rotates every hour.
timebox = "4320h"
inactivity_timeout = "2160h"

[auth.email]
# Must stay true or magic-link login is disabled ("Email logins are disabled").
# New email accounts are still blocked by [auth] enable_signup = false + shouldCreateUser: false.
enable_signup = true
enable_confirmations = false
otp_expiry = 86400
max_frequency = "60s"

[functions.quiz-complete]
enabled = true
verify_jwt = false

[functions.charge-agent-credits]
enabled = true
verify_jwt = true

[functions.create-checkout-session]
enabled = true
verify_jwt = false

[functions.stripe-webhook]
enabled = true
verify_jwt = false

[functions.cancel-subscription]
enabled = true
verify_jwt = true
